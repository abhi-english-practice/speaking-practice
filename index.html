async function startRecord(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){state.recStatus='Microphone recording requires a supported browser and a secure page (HTTPS or localhost).';render();return}
 const run=++recordingRun;
 try {
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  if(run!==recordingRun||state.mode!=='speak'){stream.getTracks().forEach(t=>t.stop());return}
  recordStream=stream;recChunks=[];state.recMime=recordMime();
  const opts=state.recMime?{mimeType:state.recMime}:undefined;
  const recorder=new MediaRecorder(stream,opts);mediaRecorder=recorder;
  recorder.ondataavailable=e=>{if(e.data.size && run===recordingRun)recChunks.push(e.data)};
  recorder.onstop=()=>{
   if(recordStream===stream){stream.getTracks().forEach(t=>t.stop());recordStream=null}
   if(mediaRecorder===recorder)mediaRecorder=null;
   if(run!==recordingRun||!recChunks.length){return}
   const blob=new Blob(recChunks,{type:recorder.mimeType||state.recMime||'audio/webm'});
   if(state.recordingUrl)URL.revokeObjectURL(state.recordingUrl);
   state.recordingUrl=URL.createObjectURL(blob);
   state.recMime=recorder.mimeType||state.recMime;
   state.recStatus='Recording ready. Play it back or download it.';
   if(state.mode==='speak')render();
  };
  recorder.start();state.recStatus='Recording… Speak clearly. Press Stop to finish.';render();
 }catch(e){
  if(run!==recordingRun)return;
  state.recStatus=e.name==='NotAllowedError'?'Microphone access denied. Please allow microphone permission.':'Unable to start recording: '+e.message;
  if(recordStream){recordStream.getTracks().forEach(t=>t.stop());recordStream=null}
  render();
 }
}

 case 'quiz-choice':if(!state.quizReveal){state.choice=+id;render()}break;
 case 'quiz-check':if(state.choice!==null){state.quizReveal=true;if(state.choice===allQuiz[state.qg].answer)state.quizDone.add(state.qg);render()}break;
 case 'quiz-prev':setQuizGlobal(state.qg-1);break;case 'quiz-next':setQuizGlobal(state.qg+1);break;
 case 'card-scope':state.cardFilter=id;state.cardIndex=0;state.cardFlipped=false;render();break;case 'card-filter':state.cardMode=id;state.cardIndex=0;state.cardFlipped=false;render();break;
 case 'card-flip':state.cardFlipped=!state.cardFlipped;render();break;case 'card-prev':state.cardIndex--;state.cardFlipped=false;render();break;case 'card-next':state.cardIndex++;state.cardFlipped=false;render();break;
 case 'card-mark':markCard(id);break;case 'card-reset':state.cardMarks.clear();state.cardMode='all';state.cardIndex=0;state.cardFlipped=false;render();break;
 case 'card-shuffle':{const pool=filteredCards();if(pool.length>1)state.cardIndex=(state.cardIndex+1+Math.floor(Math.random()*(pool.length-1)))%pool.length;state.cardFlipped=false;render();break;}
 case 'card-open':cardOpen(id);break;case 'card-jump':{const pool=filteredCards(),v=pool[state.cardIndex];state.sg=allSentences.findIndex(s=>s.ti===v.ti&&s.si===v.sentenceIndex);state.ti=v.ti;state.placed=[];state.builderResult='';state.builderReveal=false;setMode('sentence');break;}
 case 'timer-start':if(state.timerRunning){stopTimer();render()}else{if(state.remaining<=0)state.remaining=45;state.timerRunning=true;tick=setInterval(()=>{state.remaining=Math.max(0,state.remaining-1);updateTimer();if(state.remaining===0){stopTimer();render()}},1000);render()}break;
 case 'timer-reset':stopTimer();state.remaining=45;render();break;
 case 'record-start':startRecord();break;case 'record-stop':stopRecord();break;
 case 'record-remove':if(state.recordingUrl)URL.revokeObjectURL(state.recordingUrl);state.recordingUrl=null;state.recStatus='Recording deleted.';render();break;
 case 'record-download':if(state.recordingUrl){let link=document.createElement('a');link.href=state.recordingUrl;link.download=`speaking-topic-${state.ti+1}.${state.recMime.includes('mp4')?'m4a':'webm'}`;link.click()}break;
 case 'speak-show':state.speakShow=!state.speakShow;render();break;case 'speak-vi':state.speakVi=!state.speakVi;render();break;
 case 'paint':{if(savedSelection&&$('reading-text')&&$('reading-text').contains(savedSelection.startContainer)){paintSelection(b.dataset.color,savedSelection);savedSelection=null}else paintSelection(b.dataset.color);break;}
 case 'paint-undo':state.paint.pop();applyPaint();break;case 'paint-clear':state.paint=[];applyPaint();break;
}});
render();
</script></body></html>
